  <style>
    @font-face {
      font-family: Bruh;
      src: url("DumbNSillyRegular-2OEyW.ttf");
    }

    body {
      overflow-wrap: break-word;
      font-family: Bruh;
      font-size: 2em;
    }

    #loader67 {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Full-Screen Dialog Styles */
    #confirmation-dialog {
      /* Full screen positioning */
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 5vw;
      box-sizing: border-box;

      /* Visual styling */
      font-family: Arial, sans-serif;
      font-size: 1em;
      border: none;
      background: #eee;
      /* Text above buttons: main container is column */
      display: flex;
      flex-direction: column; 
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 10;
      
      /* --- FIX: Add padding at the top to clear the fixed character box --- */
      padding-top: 15vh; 
    }

    /* Styling for the dialog message text */
    #dialog-message {
      max-width: 80%; 
      font-size: 1em; 
      margin-right: 0; 
      margin-bottom: 20px; 
    }

    /* Button container uses row to put buttons side-by-side */
    #dialog-buttons {
        display: flex;
        flex-direction: row; 
        gap: 10px; 
    }

    #dialog-buttons button {
      font-family: Bruh;
      font-size: 1.2em;
      padding: 0.5em 1em;
      margin: 0.5em; 
    }

    /* Center and Slightly Bigger Initial Button */
    #bruh {
      /* Positioning */
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      /* Sizing: Slightly larger than default, but not gigantic */
      padding: 0.8em 1.5em;
      font-size: 1.3em;
    }

    /* Audio Icon Styling (Now text/emoji based) */
    #audio-toggle-icon {
      position: fixed;
      top: 15px;
      right: 15px;
      font-size: 2em;
      cursor: pointer;
      z-index: 1000;
    }
    
    /* New Style for Success State */
    #win-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 2em;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif
    }

    #win-screen h1 {
        font-size: 2em;
        margin: 0.1em;
    }

    /* --- Character Box Styles (FREE-FLOATING TOP-CENTER IMAGE) --- */
    #character-box {
        position: fixed;
        top: 20px; 
        left: 50%;
        transform: translateX(-50%); 
        width: auto;
        height: auto; 
        background: none; 
        display: none; 
        box-sizing: border-box;
        padding: 0; 
        z-index: 20;
    }

    #character-image {
        position: static; 
        height: auto; 
        max-height: 30vh; 
        width: auto;
        image-rendering: pixelated;
    }
    
    /* --- OPTIONAL: Adjust character height on very small screens to prevent overlap (Max-width 600px is typical mobile) --- */
    @media (max-width: 600px) {
        #character-image {
            max-height: 20vh; /* Make the fox smaller on mobile */
        }
        #confirmation-dialog {
            padding-top: 10vh; /* Reduce padding slightly since the fox is smaller */
        }
    }


    /* --- Hide the speech text --- */
    #character-speech {
        display: none; 
    }

    function playSound(audioElement) {

            // 2. We skip setting characterSpeech text because CSS hides it, 
            // but we still use the state to change the image.

            // 3. Display the Character Box
            characterBox.style.display = 'block'; // Use block for centering

            // Reset speaking flag after a short delay
            setTimeout(() => {
                this.speaking = false;
            }, 500); // 500ms delay to prevent immediate state change issues
        }

        static hide() {
            characterBox.style.display = 'none';
        }
    }

document.getElementById('saving').remove()
document.getElementById('gtg').removeAttribute('style')

    // --- Core Logic ---

    function startConfirmationChain() {
      // 1. Hide the initial button now that the game is starting
      initialButton.style.display = 'none'

      // 2. Start the game loop
      messageIndex = 0
      showNextConfirmation()
    }

    function showNextConfirmation() {
      if (messageIndex >= bruhifyConfirmations.length) {
        dialog.close()
        dialog.style.display = 'none'
        // *** SUCCESS STATE GOES HERE ***
        new WinGame() // Call the new success class
        return
      }

      // --- Use object with message and state ---
      const confirmation = bruhifyConfirmations[messageIndex]
      const message = confirmation.message
      const state = confirmation.state
      
      // 1. Set the main dialog text (now above the buttons)
      messageDisplay.textContent = message;

      // 2. Set the character image state
      Character.speak(message, state); 
      
      // 3. Show dialog
      dialog.style.display = 'flex' // make dialog visible
      dialog.show() // native dialog show
    }


    function handleYesClick() {
      // Play ping sound on success
      playSound(pingAudio)

      dialog.close()
      dialog.style.display = 'none'
      messageIndex++

      if (messageIndex < bruhifyConfirmations.length) {
        showNextConfirmation()
      } else {
        // Explicitly handle the win state here as well, just in case
        new WinGame()
      }
    }

    function handleNoClick() {
      dialog.close()
      dialog.style.display = 'none'
      new bruhify()
    }
    
    // --- Developer Skip Logic ---
    function handleKeyDown(event) {
        // Check if the URL is localhost:5500
        const isLocalhost = location.href.includes('localhost:5500');
        
        // Check for the key combo: W key + Alt key + (Ctrl key OR Meta key (Cmd on Mac))
        const isWinCombo = event.key === 'W' && event.altKey && (event.ctrlKey || event.metaKey); 

        if (isLocalhost && isWinCombo) {
            console.log('Developer skip combo detected on localhost! Skipping to win state.');
            event.preventDefault(); // Prevent default browser actions (like opening history/downloads)
            
            // Only trigger if we aren't already on the win screen
            if (document.getElementById('win-screen') === null) {
              new WinGame();
            }
        }
    }


    // --- Initialization ---

    document.addEventListener('DOMContentLoaded', () => {
      // Attach event listeners to game buttons
      yesButton.addEventListener('click', handleYesClick)
      noButton.addEventListener('click', handleNoClick)

      // This attaches the game start function to the button
      initialButton.addEventListener('click', startConfirmationChain)

      // Attach toggle function to audio icon
      audioIcon.addEventListener('click', toggleAudio)
      
      // Keydown listener for developer skip
      document.addEventListener('keydown', handleKeyDown);

      // We ensure the dialog is CLOSED immediately via JavaScript
      dialog.close()
      // Added display:none to initialization to hide it visually
      dialog.style.display = 'none';
      Character.hide(); // Hide character initially
    })

    window.CloudStorage.waitForLoad().then(function () {
      document.querySelector('#loader67').style.display = 'none'

      // Show the initial button when the page finishes loading
      initialButton.style.display = 'block'
    })
