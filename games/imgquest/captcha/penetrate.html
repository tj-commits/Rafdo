<!doctype html>
<html>
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="/games/imgquest/ife/auralink.js"></script>
    
    <title>Player succesfully succeds penetration (1000000000 iq)</title>
</head>
<body>
    <h1>You are not a robot! <sup>(or are you)</sup> YOU UNLOCKED SOME IMAGES</h1>
    <img src="robot.png" alt="captcha">
    <img width="300" src="ROBOT PENETRATES.png" alt="ROBOT PENETRATING THE CAPTCHA">
    <br><br><br>

    <button id="gallery-button" style="display: none">go to gallery</button>
    
    <script src="/games/imgquest/ife/client.js"></script>
    <script>
        const galleryButton = document.getElementById('gallery-button')

        window.CloudStorage.waitForLoad().then(() => {
            window.CloudStorage.setItem('penetrated', 'mhm')

            galleryButton.addEventListener('click', () => {
                galleryButton.disabled = true
                window.CloudStorage.syncBeforeRedirect().then(() => {
                    location.assign('/games/imgquest/gallery.html')
                }).catch(error => {
                    console.error("Error during cloud sync before redirect:", error)
                    location.assign('/games/imgquest/gallery.html') 
                })
            })

            galleryButton.style.display = 'block'

        }).catch(error => {
            console.error("Error waiting for CloudStorage to load:", error)
            
            galleryButton.addEventListener('click', () => {
                location.assign('/games/imgquest/gallery.html')
            })
            galleryButton.style.display = 'block'
        })
    </script>
</body>
</html>
