
<!DOCTYPE html>
<html lang="en">
<head>
	
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
	/* Ensure the body takes up the full height of the viewport */
body, html {
  height: 100%;
  margin: 0;
}

.loading-overlay {
  /* Position fixed covers the whole screen and stays put even when scrolling */
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh; /* Use 100vh for full viewport height */
  
  /* Use Flexbox to center the content */
  display: flex;
  justify-content: center; /* Centers horizontally */
  align-items: center; /* Centers vertically */
  
  z-index: 100; /* Ensures it is on top of other content */
}

/* Example CSS for a simple animated spinner */
.spinner {
  border: 8px solid #f3f3f3; /* Light grey border */
  border-top: 8px solid #3498db; /* Blue top border (the "spinning" part) */
  border-radius: 50%;
  width: 60px;
  height: 60px;
  animation: spin 2s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

   body {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
      flex-direction: column;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      background: #333;
   }
   .loader {
    width: 70px;
    height: 70px;
    border: 5px solid #fff;
    border-bottom-color: transparent;
    border-radius: 50%;
    display: inline-block;
    box-sizing: border-box;
    animation: rotation 1s linear infinite;
    }

    @keyframes rotation {
    0% {
        transform: rotate(0deg);
    }
    100% {
        transform: rotate(360deg);
    }
    } 
</style>
  <script src="/games/imgquest/ife/auralink.js"></script>
	<title>Saving Settings</title>
</head>
<body>
	
<body>
  <div class="loading-overlay">
    <!-- The spinner element or image goes here -->
    <div class="loader"></div>
  </div>
  
<script>
   window.CloudStorage.waitForLoad().then(() => {
      
	const search = new URLSearchParams(location.search)
	CloudStorage.setItem('settings-saved-before', true)
	CloudStorage.setItem('sse', search.get('sse'))

   CloudStorage.syncBeforeRedirect().then(() => {
      setTimeout(() => {
         
   if (search.get('redhome') != null) {
      location.replace('/hegira/index.html')
   } else {
      location.replace('/hegira/settings.html')
   }
      }, 10)
   })
   })

</script>
</body>
