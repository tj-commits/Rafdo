<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | StartYourHegira</title>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="/games/imgquest/ife/auralink.js"></script>

    <style>
      :root {
        --primary-color: #4a90e2;
        --bg-color: #f4f7f6;
        --card-bg: #ffffff;
        --text-color: #333;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-color);
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      /* Loading Screen Styles */
      #loader {
        position: fixed;
        inset: 0;
        background: var(--bg-color);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
        transition: opacity 0.3s ease;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #ddd;
        border-top: 4px solid var(--primary-color);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 1rem;
      }

      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      /* UI Styles */
      .settings-card {
        background: var(--card-bg);
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        display: none; /* Hidden until loaded */
      }

      h1 {
        margin: 0 0 1.5rem 0;
        font-size: 1.5rem;
      }
      .form-group {
        margin-bottom: 1.5rem;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        font-size: 0.9rem;
      }

      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 1rem;
        outline-color: var(--primary-color);
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 2rem;
      }

      button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s;
      }

      .btn-save {
        background-color: var(--primary-color);
        color: white;
      }
      .btn-back {
        background-color: #e0e0e0;
        color: #555;
      }
      button:hover {
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="spinner"></div>
      <p>Loading page, please wait...</p>
    </div>

    <div class="settings-card" id="settingsCard">
      <h1>Settings</h1>

      <form action="/hegira/settingssave.html" method="get">
        <div class="form-group">
          <label for="sse">Default Search Engine</label>
          <select id="sse" name="sse">
            <option value="serp">Rafdo Search (SerpAPI)</option>
            <option value="tree">Ecosia</option>
            <option value="duck">DuckDuckGo</option>
            <option value="gle">Google</option>
            <option value="bing">Bing</option>
            <option value="xng">Etsi (SearXNG)</option>
            <option value="yahoo">Yahoo!</option>
            <option value="startpage">Startpage</option>
            <option value="att">AT&T DNSErrorAssist</option>
            <option value="yandex">Yandex</option>
          </select>
        </div>

        <div class="actions">
          <button
            type="button"
            class="btn-back"
            onclick="location.assign('/hegira/index.html')"
          >
            Back
          </button>
          <button type="submit" class="btn-save">Save Changes</button>
        </div>
      </form>
    </div>

    <script>
      const select = document.getElementById("sse")
      const loader = document.getElementById("loader")
      const card = document.getElementById("settingsCard")

      window.CloudStorage.waitForLoad()
        .then(() => {
          const savedEngine = window.CloudStorage.getItem("sse")

          if (savedEngine) {
            select.value = savedEngine
          } else {
            select.value = "serp" 
          }

          loader.style.opacity = "0"
          setTimeout(() => {
            loader.style.display = "none"
            card.style.display = "block"
          }, 300)
        })
        .catch((err) => {
          console.error("CloudStorage failed to load:", err)
          loader.innerHTML = "<p>Error loading settings. Please refresh.</p>"
        })
    </script>
  </body>
</html>
