<img src="/games/imgquest/ColorDifference/Hard.jpg" alt="Hard color differnece">

<button id="gallery-button" style="display: none">Go to gallery</button>

<script>
    const galleryButton = document.getElementById('gallery-button')

    window.CloudStorage.waitForLoad().then(() => {
        window.CloudStorage.setItem('gallery:colorDifferenceHard', 'mhm')

        galleryButton.addEventListener('click', () => {
            galleryButton.disabled = true
            window.CloudStorage.syncBeforeRedirect().then(() => {
                location.assign('/games/imgquest/gallery.html')
            }).catch(error => {
                console.error("Error during cloud sync before redirect:", error)
                location.assign('/games/imgquest/gallery.html') 
            })
        })

        galleryButton.style.display = 'block'

    }).catch(error => {
        console.error("Error waiting for CloudStorage to load:", error)
        
        galleryButton.addEventListener('click', () => {
             location.assign('/games/imgquest/gallery.html')
        })
        galleryButton.style.display = 'block'
    })
</script>
