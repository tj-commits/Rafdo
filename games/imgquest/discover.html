    /* NEW STYLES FOR LOADING SCREEN */
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;

    }

    #main-content {

    .share-tech-mono-regular {

    }

    h1 {
      font-size: 3.5em;
    }

    .rainbow-text {
      background-image: repeating-linear-gradient(45deg, violet, indigo, blue, green, yellow, orange, red, violet);
      text-align: center;
      background-size: 800% 800%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 24px;
      animation: rainbow 8s ease infinite;
    }

    @keyframes rainbow {
      0% {
        background-position: 0% 50%
      }

      50% {
        background-position: 100% 25%
      }

      100% {
        background-position: 0% 50%
      }
    }

    button,
    a.btn {
      padding: 10px;
      border: none;
      outline: none;
      background: #333;
      color: white;
      font-family: sans-serif;
      border-radius: 6px;
      cursor: pointer;
      transition: 200ms ease-in-out;
      /*margin-right: 5px;*/
      min-width: 5em;
    }





    button:hover {

    #top-sect {

    }

    #quests {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .centre {
      text-align: center;
      margin: auto;
    }

    a.btn[href] {
      text-decoration: none;
      color: #fff
    }

    a.auralink {
      /* Override the default button/a.btn styles for a unique look */
      background-color: #008cba;
      /* A bright, solid color as fallback */
      border: 3px solid transparent;
      font-weight: bold;
      padding: 10.5px 15px;
      /* MODIFIED: Horizontal padding decreased to 20px for reduced width */
      margin-top: 15px;
      /* Separate it visually */
      display: inline-block;
      /* Essential for padding/margin */
      border-radius: 10px;
      font-size: 15px;
      /* Add Rainbow/Glow Effect */
      background-image: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
      background-size: 400% 400%;
      /* Larger size for animation smoothness */
      animation: color-shift 5s ease infinite, glow 1.5s ease-in-out infinite alternate;
      color: white !important;
      /* Ensure text is readable */
      box-shadow: 0 0 10px rgba(0, 140, 186, 0.5);
      /* Initial subtle shadow */
      transition: 0.4s;
    }

    a.auralink:hover {
      box-shadow: 0 0 20px rgba(255, 0, 255, 0.8), 0 0 40px rgba(0, 255, 255, 0.6);
      /* More intense glow on hover */
      transform: scale(1.05);
      /* Slightly enlarge on hover */
    }

    /* Keyframes for the background color animation */
    @keyframes color-shift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* Keyframes for the subtle glow effect */
    @keyframes glow {
      from {
        text-shadow: 0 0 5px #000, 0 0 10px #ffcc00;
      }

      to {
        text-shadow: 0 0 8px #000, 0 0 15px #00ffff;
      }
    }

    /* Positioning for Top Left Corner */
    #auralink-button {
      position: fixed;
      /* Positions relative to the viewport */
      top: 20px;
      /* Spacing from the top edge */
      left: 20px;
      /* Spacing from the left edge */
      z-index: 10000;
      /* Ensures it sits on top of other content */
      margin-top: 0 !important;
      /* Remove any inherited top margin */
    }

    .Easy {
      color: limegreen;
      font-weight: bold;
    }

    .Medium {
      color: #ffff00;
      font-weight: bold;
    }

    .difficulty {
      background-color: rgb(0, 0, 0);
      border-radius: 10px;
    }

    .Hard {
      color: orange;
      font-weight: bold;
    }

    .Extreme {
      color: red;
      font-weight: bold;
    }

    .quest {
      border-width: 2px;
      border-color: #000;
      border-style: solid;
      padding: 20px;
      border-radius: 10px;
      background: #eee;
      transition: 200ms ease-in-out;
      box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
    }

    .quest:hover {
      transform: scale(105%);
    }

    .a.btn {
      cursor: pointer;
    }

        function create(number, name, difficulty, imagesunlockable, link) {
          var q = document.createElement('div')
          q.classList.add('quest')

          var number2 = document.createElement('p')
          number2.innerHTML = "Quest #" + number.toString()
          number2.classList.add('number')
          var questname = document.createElement('p')
          questname.textContent = name
          questname.classList.add('questname')
          var newimages = document.createElement('p')
          newimages.textContent = `+${imagesunlockable} new image${imagesunlockable === 1 ? "" : "s"} can be found on this quest!`
          newimages.classList.add('newimages', 'green')
          var thing = document.createElement('span'); thing.classList.add('thing')
          var difficulty2 = document.createElement('p')
          difficulty2.textContent = "Difficulty: " + difficulty
          difficulty2.classList.add('difficulty', difficulty)

          var a = document.createElement('a')
          a.href = link
          a.classList.add('btn')
          a.textContent = "Play Quest"

          q.append(number2, questname, difficulty2, newimages, thing, document.createElement('br'), document.createElement('br'), a)

          document.getElementById('quests').append(q)
          return q
        }
        // entr handles locking of quests
        // quest is the quest created from quest
        // lskey is the loclastorage key for the quest
        // last is if it is the last quest (yes_d for yes)
        function entr(quest, lskey, last = "nope") {
          if (localStorage.getItem(lskey) != null) {
            quest.querySelector('.newimages').classList.add('finished')
            quest.querySelector('.thing').classList.add('locked')
            quest.querySelector('.thing').innerHTML = "Quest already completed. No more new images can be obtained"

              quest.querySelector('.thing').classList.add('locked')
              quest.querySelector('.thing').innerHTML = "Quest Locked"
            }

          lastCheckCompleted = false
          }

        }
        // combine entr and create with quest
        function quest(number, name, difficulty, imagesunlockable, link, lskey, last) {
          return entr(create(number, name, difficulty, imagesunlockable, link), lskey, last)
