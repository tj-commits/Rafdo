<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StartYourHegira</title>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="/games/imgquest/ife/auralink.js"></script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <style>
    :root {
      --bg-color: #f8fafd;
      --text-main: #202124;
      --accent: #3498db;
      --modal-bg: rgba(0, 0, 0, 0.5);
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: radial-gradient(circle at top right, #eef2f3, var(--bg-color));
      color: var(--text-main);
      min-height: 100vh;
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      z-index: 9999;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
      z-index: 10;
    }

    .header-left, .header-right {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    
    .btn {
      padding: 8px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
      background: #fff;
      color: #5f6368;
      border: 1px solid #dfe1e5;
      transition: 0.3s;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .auralink {
      background-image: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
      background-size: 400%;
      color: white !important;
      border: none !important;
      animation: shift 8s infinite;
    }

    @keyframes shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 15vh;
    }

    #logo {
      max-width: 220px;
      margin-bottom: 30px;
    }

    .search-wrapper {
      display: flex;
      align-items: center;
      background: #fff;
      border: 1px solid #dfe1e5;
      border-radius: 28px;
      padding: 6px 15px;
      width: 90vw;
      max-width: 580px;
      transition: box-shadow 0.2s;
    }

    .search-wrapper:focus-within {
      box-shadow: 0 1px 6px rgba(32,33,36,0.28);
    }

    .sbox {
      flex-grow: 1;
      border: none;
      outline: none;
      height: 40px;
      font-size: 16px;
      padding: 0 10px;
    }

    .bookmarks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 20px;
      width: 90vw;
      max-width: 600px;
      margin-top: 40px;
      padding: 20px;
    }

    .bookmark-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-main);
      position: relative;
      transition: transform 0.2s;
    }

    .bookmark-item:hover { transform: translateY(-5px); }

    .bookmark-icon {
      width: 48px;
      height: 48px;
      background: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 8px;
      font-size: 24px;
      overflow: hidden;
    }

    .bookmark-name {
      font-size: 12px;
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .add-btn {
      cursor: pointer;
      border: 2px dashed #ccc;
      background: transparent;
      color: #888;
    }
    
    .delete-btn {
      position: absolute;
      top: -5px;
      right: 20px;
      background: rgba(255,0,0,0.7);
      color: white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 12px;
      display: none;
      justify-content: center;
      align-items: center;
      border: none;
      cursor: pointer;
    }

    .bookmark-item:hover .delete-btn { display: flex; }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--modal-bg);
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 90%;
      max-width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-save { background: #333; color: white; border: none; }

    #main-content { display: none; }
  </style>
</head>
<body>

  <div id="loading-overlay">Loading, please wait...</div>

  <div id="main-content">
    <header>
      <div class="header-left">
        <a href="/" class="btn">Back to Rafdo Homepage</a>
      </div>
      <div class="header-right">
        <a href="/hegira/settings.html" class="btn">Settings</a>
        <a href="/games/imgquest/signin.html?type=hegira" class="btn auralink" id="auralink-button">Log In</a>
      </div>
    </header>

    <main>
      <img src="/hegira/logo.png" alt="start your hegira" id="logo" />
      
      <form method="GET" action="/hegira/webredirect/autodetect.html" class="search-wrapper">
        <span class="material-symbols-outlined" style="color: #9aa0a6;">search</span>
        <input id="q" type="text" name="q" class="sbox" placeholder="Search..." required autocomplete="off" />
        <button type="submit" style="background:none; border:none; cursor:pointer;">
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
      </form>

      <div class="bookmarks-grid" id="bookmarkContainer">
        <div class="bookmark-item" onclick="showModal()">
          <div class="bookmark-icon add-btn">
            <span class="material-symbols-outlined">add</span>
          </div>
          <div class="bookmark-name">Add Shortcut</div>
        </div>
      </div>
    </main>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0">Add Shortcut</h3>
      <input type="text" id="bmName" placeholder="Name">
      <input type="text" id="bmUrl" placeholder="URL (https://...)">
      <div class="modal-actions">
        <button class="btn" onclick="hideModal()" style="flex:1">Cancel</button>
        <button class="btn btn-save" onclick="saveBookmark()" style="flex:1">Add</button>
      </div>
    </div>
  </div>

  <script>
    const bookmarkContainer = document.getElementById('bookmarkContainer')
    const modal = document.getElementById('modal')

    window.CloudStorage.waitForLoad().then(() => {
      if (window.CloudStorage.getItem('sse') == null) {
        location.replace('/hegira/settingssave.html?redhome=yes&sse=serp')
        return
      }
      renderBookmarks()
      document.getElementById('loading-overlay').style.display = 'none'
      document.getElementById('main-content').style.display = 'block'
      
      let engineName = 'Rafdo Search'
      switch (window.CloudStorage.getItem('sse')) {
        case 'serp': engineName = 'Rafdo Search'; break
        case 'tree': engineName = 'Ecosia'; break
        case 'xng': engineName = 'SearXNG'; break
        case 'gle': engineName = 'Google'; break
        case 'duck': engineName = 'DuckDuckGo'; break
        case 'yahoo': engineName = 'Yahoo'; break
        case 'bing': engineName = 'Bing'; break
        case 'startpage': engineName = 'Startpage'; break
        case 'att': engineName = 'AT&T DNSErrorAssist'; break
        case 'yandex': engineName = 'Yandex'; break
      }
      document.querySelector('#q').placeholder = "Search with " + engineName
    })

    function getBookmarks() {
      const data = window.CloudStorage.getItem('hegira_bookmarks')
      return data ? JSON.parse(data) : []
    }

    function renderBookmarks() {
      const bookmarks = getBookmarks()
      const items = document.querySelectorAll('.bookmark-generated')
      items.forEach(el => el.remove())
      bookmarks.forEach((bm, index) => {
        const div = document.createElement('div')
        div.className = 'bookmark-item bookmark-generated'
        div.innerHTML = `
          <button class="delete-btn" onclick="deleteBookmark(${index}); event.preventDefault();">×</button>
          <a href="${bm.url}" style="text-decoration:none; color:inherit; display:contents;">
            <div class="bookmark-icon">
              <img src="https://www.google.com/s2/favicons?sz=64&domain=${bm.url}" width="32">
            </div>
            <div class="bookmark-name">${bm.name}</div>
          </a>
        `
        bookmarkContainer.prepend(div)
      })
    }

    function showModal() {
      modal.style.display = 'flex'
      document.getElementById('bmName').focus()
    }

    function hideModal() {
      modal.style.display = 'none'
      document.getElementById('bmName').value = ''
      document.getElementById('bmUrl').value = ''
    }

    function saveBookmark() {
      const name = document.getElementById('bmName').value
      const url = document.getElementById('bmUrl').value
      if (name && url) {
        const bookmarks = getBookmarks()
        bookmarks.push({ name, url })
        window.CloudStorage.setItem('hegira_bookmarks', JSON.stringify(bookmarks))
        if(window.CloudStorage.syncBeforeRedirect) {
          window.CloudStorage.syncBeforeRedirect().then(() => {
            renderBookmarks()
            hideModal()
          })
        } else {
          renderBookmarks()
          hideModal()
        }
      }
    }

    function deleteBookmark(index) {
      const bookmarks = getBookmarks()
      bookmarks.splice(index, 1)
      window.CloudStorage.setItem('hegira_bookmarks', JSON.stringify(bookmarks))
      renderBookmarks()
    }

    modal.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveBookmark()
      if (e.key === 'Escape') hideModal()
    })
  </script>
</body>
</html>
