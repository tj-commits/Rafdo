<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraLink Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #1a1a1a;
            color: #00ff00;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #00ff00;
            padding: 20px;
            box-shadow: 0 0 10px #00ff00;
        }

        h1 {
            color: #00ffff;
            border-bottom: 2px solid #00ff00;
            padding-bottom: 10px;
        }

        .actions {
            margin-bottom: 20px;
        }

        button {
            background-color: #333;
            color: #00ffff;
            border: 1px solid #00ff00;
            padding: 10px 15px;
            margin-right: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #00ff00;
            color: #1a1a1a;
        }

        .app-list div {
            padding: 15px;
            border-bottom: 1px dashed #00ff00;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-list div:last-child {
            border-bottom: none;
        }

        .app-link {
            color: #00ffff;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .app-link:hover {
            text-decoration: underline;
        }

        .delete-btn {
            color: #ff0000;
            border-color: #ff0000;
        }

        .delete-btn:hover {
            background-color: #ff0000;
            color: #1a1a1a;
        }

        #status-message {
            margin-top: 20px;
            font-size: 1.1em;
            color: #ffff00;
        }

        .hidden {
            display: none;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>

<body>
    <div class="container">
            <button onclick="location.assign('/')">Back To Rafdo Homepage</button>
            <button onclick="location.assign('/auralink/')">Visit AuraLink main page</button>
        <h1>AuraLink Status</h1>
        <div id="auth-status" class="hidden">
            <div class="actions">
                <p>Logged in as: <strong id="user-email"></strong></p>
                <button id="logout-btn">Log Out</button>
            </div>
        </div>

        <div id="loading-message">
            Checking authentication status...
        </div>

    </div>

    <script>
        // --- 1. APPLICATION CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyA0od4tjCBHxltVHE3Uw-Ht5Frd2kDSOWc",
            authDomain: "winged-amp-476818-s8.firebaseapp.com",
            projectId: "winged-amp-476818-s8",
            storageBucket: "winged-amp-476818-s8.firebasestorage.app",
            messagingSenderId: "819476698359",
            appId: "1:819476698359:web:c41dd94d52607ea440aff2", // Using Notepad's appId for the Dashboard itself
            measurementId: "G-97GWD74F3Y" // Using Notepad's measurementId
        };


        // --- 2. FIREBASE INITIALIZATION ---
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();


        // --- 3. AUTHENTICATION LOGIC ---
        auth.onAuthStateChanged(user => {
            const authStatusDiv = document.getElementById('auth-status');
            const loadingMessage = document.getElementById('loading-message');

            loadingMessage.classList.add('hidden');

            if (user) {
                // User is logged in
                authStatusDiv.classList.remove('hidden');
                document.getElementById('user-email').textContent = user.email;
                renderAppList(user.uid);

            } else {
                // User is not logged in
                window.location.replace("/r2/notepad/?dashboard=1");
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            auth.signOut().then(() => {
                window.location.replace("/auralink/");
            }).catch((error) => {
                alert("Error logging out: " + error.message);
            });
        });

    </script>
</body>

</html>
